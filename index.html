<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>완도 섬 부동산 — 섬마을 집·땅·귀어귀농 매물</title>
<meta name="description" content="완도읍·노화·보길·청산·신지 등 완도 12개 읍면의 주택, 전원주택, 토지, 상가 매물을 360° VR로 둘러보세요.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ============ 기본 ============ */
:root{
  --ink:#16202B;--sub:#66707C;--mute:#9AA3AD;--line:#E7EAEE;--bg:#F5F6F8;--card:#FFFFFF;
  --deep:#0F2233;--deep2:#173A4F;               /* 밤바다 */
  --coral:#FF5A36;--coral-d:#E2431F;--coral-s:#FFEDE7;   /* 전복 살·새우 */
  --kelp:#2D7A57;--kelp-s:#E6F3EC;              /* 다시마·미역 */
  --sun:#FFB81C;
  --nacre:linear-gradient(115deg,#F7D6E0 0%,#CFE8F1 28%,#E7DCF5 52%,#D8F1E4 76%,#F7E3CF 100%); /* 전복 껍데기 자개빛 */
  --r:16px;--sh:0 8px 28px rgba(15,34,51,.10);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
html,body{overflow-x:clip}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
.dh{font-family:"Do Hyeon","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}

/* ============ 헤더 ============ */
.hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hd.dark{background:transparent;border-color:transparent;position:absolute;left:0;right:0}
.hd .in{height:68px;display:flex;align-items:center;gap:22px}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo b{font-family:"Do Hyeon";font-size:23px;letter-spacing:-.02em;line-height:1}
.logo small{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.02em;margin-top:2px}
.hd.dark .logo b,.hd.dark .nav a{color:#fff}.hd.dark .logo small{color:rgba(255,255,255,.7)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{padding:8px 13px;border-radius:10px;font-weight:500;font-size:15px;color:#3A4450;white-space:nowrap}
.nav a:hover{background:rgba(0,0,0,.05)}.hd.dark .nav a:hover{background:rgba(255,255,255,.12)}
.nav a.on{color:var(--coral);font-weight:700}
.nav .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;margin-left:4px;padding:0 5px}
.tel{flex:none;display:flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;background:var(--coral);color:#fff;font-weight:700;font-size:14px}
.hd.dark .tel{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4)}
.menuBtn{display:none;margin-left:auto;border:0;background:none;width:40px;height:40px}
.hd.dark .menuBtn{color:#fff}

/* ============ 홈: 히어로 (밤바다 + 헤엄치는 물고기) ============ */
.hero{position:relative;overflow:hidden;min-height:560px;color:#fff;
  background:radial-gradient(1200px 500px at 70% -10%,#2B5870 0%,transparent 60%),linear-gradient(180deg,#0B1B29 0%,var(--deep) 45%,var(--deep2) 100%)}
.hero .sea{position:absolute;inset:0;pointer-events:none;z-index:1}
.vids{position:absolute;inset:0;z-index:0;overflow:hidden}
.vids video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.8s ease;transform:scale(1.04)}
.vids video.on{opacity:1;animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.08)}to{transform:scale(1.0)}}
.vshade{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(11,27,41,.62) 0%,rgba(15,34,51,.30) 45%,rgba(23,58,79,.78) 100%);opacity:0;transition:opacity 1.2s}
.hero.hasVid .vshade{opacity:1}.hero.hasVid .fish{opacity:.28}
.vdots{position:absolute;right:22px;bottom:118px;z-index:3;display:flex;gap:6px}
.vdots i{width:26px;height:4px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.vdots i.on::after{content:"";display:block;height:100%;background:#fff;animation:vbar var(--d,12s) linear both}
@keyframes vbar{from{width:0}to{width:100%}}
.fish{position:absolute;left:-120px;opacity:.55;animation:swim linear infinite}
.fish svg{display:block;fill:#FFB59E}
@keyframes swim{to{transform:translateX(calc(100vw + 260px))}}
.fish.r{left:auto;right:-120px;animation-name:swimR}.fish.r svg{transform:scaleX(-1)}
@keyframes swimR{to{transform:translateX(calc(-100vw - 260px))}}
.bub{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,.45);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-620px);opacity:0}}
.hero .copy{position:relative;z-index:2;text-align:center;padding:150px 20px 150px}
.hero h1{margin:0;font-family:"Do Hyeon";font-weight:400;font-size:clamp(38px,6vw,64px);line-height:1.12;letter-spacing:-.02em;text-shadow:0 6px 30px rgba(0,0,0,.35)}
.hero p{margin:14px 0 26px;font-size:17px;color:rgba(255,255,255,.82)}
.search{display:flex;max-width:620px;margin:0 auto;background:#fff;border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.search input{flex:1;border:0;outline:0;padding:12px 16px;font-size:16px;color:var(--ink);background:transparent;min-width:0}
.search button{border:0;border-radius:10px;background:var(--coral);color:#fff;font-weight:700;padding:0 22px}
.quick{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick a{font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
.waves{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:110px;z-index:1}
/* 카테고리 카드 (직방 스타일, 히어로에 걸침) */
.cats{position:relative;z-index:3;margin:-92px auto 0;max-width:1100px;background:#fff;border-radius:22px;box-shadow:0 20px 50px rgba(15,34,51,.14);
  display:grid;grid-template-columns:repeat(6,1fr);padding:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px 18px;border-radius:16px;transition:background .15s,transform .15s}
.cat:hover{background:var(--coral-s);transform:translateY(-3px)}
.cat svg{width:46px;height:46px;stroke:var(--coral);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cat b{font-family:"Do Hyeon";font-weight:400;font-size:21px}
.cat small{font-size:12px;color:var(--sub);margin-top:-6px}

/* ============ 섹션 공통 ============ */
.sec{padding:72px 0 8px}
.sec h2{margin:0;text-align:center;font-family:"Do Hyeon";font-weight:400;font-size:clamp(28px,3.4vw,36px);letter-spacing:-.01em}
.sec .lead{margin:6px 0 30px;text-align:center;color:var(--sub);font-size:16px}
.more{display:flex;justify-content:flex-end;margin:-18px 0 14px}.more a{font-size:14px;color:var(--sub)}.more a:hover{color:var(--coral)}

/* 매물 카드 공통 썸네일 (사진 대신 유형별 일러스트) */
.thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--c1,#2E6F8E);display:grid;place-items:end start;aspect-ratio:4/3}
.thumb::before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,var(--c1),var(--c2))}
.thumb svg.ill{position:absolute;right:-6%;bottom:-8%;width:78%;opacity:.9}
.thumb img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.hasPh::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.thumb.hasPh .tp{z-index:1}
.gal{position:relative;aspect-ratio:16/9;background:#0F2233;overflow:hidden}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0F2233}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.gal .prev{left:12px}.gal .next{right:12px}
.gal .num{position:absolute;left:14px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 11px;font-size:13px}
.gal .go360{position:absolute;right:14px;bottom:12px;border:2px solid #fff;border-radius:99px;padding:9px 16px;font-weight:900;color:var(--deep);background:var(--nacre);box-shadow:0 6px 16px rgba(0,0,0,.3)}
.dnav{position:sticky;top:0;z-index:6;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);padding:8px 14px}
.dnav::-webkit-scrollbar{display:none}.dnav button{flex:none;border:0;background:none;padding:8px 12px;border-radius:99px;font-weight:700;font-size:14px;color:var(--sub)}
.dnav button.on{background:var(--ink);color:#fff}
.dsec{scroll-margin-top:70px;margin-top:34px}.dsec>h3{font-family:"Do Hyeon";font-weight:400;font-size:24px;margin:0 0 12px}
.mm{position:relative;height:260px;border-radius:14px;overflow:hidden;background:#DDE6EA;border:1px solid var(--line)}
.mm>div.mapc{position:absolute!important;inset:0;width:100%!important;height:100%!important}
.mm .mmBtn{position:absolute;right:10px;top:10px;z-index:700;border:0;border-radius:10px;background:#fff;padding:8px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.mm.big{position:fixed;inset:0;z-index:3000;height:auto;border-radius:0;border:0}
.mmNote{font-size:12.5px;color:var(--sub);margin:6px 2px 0}
.near{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.near div{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px}.near div b{display:block;font-size:12px;color:var(--sub);font-weight:500}
.near div.none{opacity:.55}
.ferry{display:flex;gap:10px;align-items:center;margin-top:10px;background:#E8F3F6;border-radius:12px;padding:12px 14px;font-size:14px}
.calc{border:1px solid var(--line);border-radius:14px;padding:16px}
.calc .in{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub)}
.calc input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:160px;font-size:15px}
.calc table{width:100%;border-collapse:collapse;font-size:14.5px}.calc td{padding:9px 4px;border-bottom:1px solid var(--line)}.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.calc tr.tot td{font-weight:900;font-size:17px;color:var(--coral-d);border-bottom:0}
.calc small{display:block;color:var(--mute);font-size:12px;line-height:1.6;margin-top:8px}
.story{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#F1ECE6,#E9F0EC);border-radius:16px;padding:18px}
.story b{font-family:"Do Hyeon";font-size:22px;font-weight:400}.story p{margin:4px 0 0;color:var(--sub);font-size:14px}
.simRow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,230px);gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.simT{font-weight:700;margin:16px 0 8px;font-size:15px}
.book{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.book label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--sub)}.book input,.book select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px}
.gal img{transition:opacity .35s}
@media (max-width:720px){#areaAlert{display:none}.near{grid-template-columns:1fr 1fr}.mm{height:220px}.calc input{width:100%}.calc .in label{flex:1}}
.mtabs{display:flex;gap:6px;padding:10px 12px;background:#0F2233}
.mtabs button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:7px 14px;font-weight:700;font-size:13.5px}
.mtabs button.on{background:var(--coral);border-color:var(--coral)}
.bdgs{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:5px;align-items:flex-start}.bdgs .vr{position:static}
.ytb{display:inline-flex;align-items:center;gap:4px;background:#FF0033;color:#fff;font-size:11.5px;font-weight:900;border-radius:99px;padding:3px 10px;border:1.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.mapLink{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:13px;font-weight:700;color:var(--coral-d);background:var(--coral-s);border-radius:99px;padding:3px 10px;white-space:nowrap}
.fr{position:fixed;inset:0;z-index:2500;background:rgba(10,22,33,.6);display:grid;place-items:center;padding:16px;animation:pop .25s ease-out}
.frBox{position:relative;width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.frTop{position:relative;overflow:hidden;color:#fff;padding:30px 26px 26px;background:radial-gradient(420px 220px at 90% 0%,rgba(255,90,54,.55),transparent 60%),linear-gradient(135deg,#0B1B29,#173A4F)}
.frTop small{display:inline-block;background:var(--coral);border-radius:99px;padding:3px 12px;font-weight:900;font-size:12px}
.frTop h2{margin:12px 0 6px;font-family:"Do Hyeon";font-weight:400;font-size:32px;line-height:1.15}.frTop p{margin:0;color:rgba(255,255,255,.82);font-size:14.5px}
.frTop svg.dr{position:absolute;right:58px;top:14px;width:110px;opacity:.95}
.frBody{padding:20px 22px 8px}
.edu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.edu div{border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center}
.edu b{display:block;margin:6px 0 2px;font-size:14.5px}.edu span{font-size:12.5px;color:var(--sub);line-height:1.5;display:block}
.edu i{font-style:normal;font-size:28px}
.frList{margin:16px 0 0;padding:0;list-style:none;font-size:14px;line-height:1.9}.frList li::before{content:"✓ ";color:var(--kelp);font-weight:900}
.frBtns{display:flex;gap:8px;padding:16px 22px 10px}.frBtns .btn{flex:1;justify-content:center}
.frFoot{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 16px;font-size:13px;color:var(--sub)}
.frFoot label{display:flex;gap:6px;align-items:center;cursor:pointer}.frFoot button{border:0;background:none;color:var(--sub);font-weight:700}
.frX{position:absolute;right:12px;top:12px;z-index:3;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px}
@media (max-width:520px){.edu{grid-template-columns:1fr}.edu div{display:grid;grid-template-columns:40px 1fr;text-align:left;align-items:center;column-gap:8px}.edu div i{grid-row:span 2}.frTop svg.dr{width:80px;opacity:.6}}
.strip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#0F2233}
.strip img{width:84px;height:60px;object-fit:cover;border-radius:6px;opacity:.55;cursor:pointer;flex:none}.strip img.on{opacity:1;outline:2px solid var(--coral)}
.thumb .tp{position:relative;margin:10px;font-family:"Do Hyeon";font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.vr{position:absolute;left:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 6px;border-radius:99px;font-size:12px;font-weight:900;color:var(--deep);
  background:var(--nacre);border:1.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.vr::before{content:"";width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--coral),var(--sun),var(--kelp),#3A8FB7,var(--coral))}
.heart{position:absolute;right:8px;top:8px;z-index:2;width:34px;height:34px;border:0;border-radius:50%;background:rgba(0,0,0,.22);display:grid;place-items:center}
.heart svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2}
.heart.on svg{fill:var(--coral);stroke:var(--coral)}
.sheet .heart svg{stroke:var(--coral)}
.badge{position:absolute;right:0;bottom:12px;z-index:2;background:var(--coral);color:#fff;font-size:12px;font-weight:900;padding:4px 12px 4px 14px;border-radius:99px 0 0 99px}
.t-주택,.t-기타{--c1:#2F6E8C;--c2:#6FA9C2}.t-전원주택{--c1:#2D7A57;--c2:#86C18B}.t-토지{--c1:#7C8B2E;--c2:#C9C86A}
.t-아파트,.t-빌라{--c1:#57507E;--c2:#9C94C8}.t-상가,.t-창고,.t-공장{--c1:#C2542F;--c2:#F29A62}

/* 추천 매물 */
.picks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,280px);gap:18px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x mandatory}
.picks{scrollbar-width:none;scroll-behavior:smooth}.picks::-webkit-scrollbar{display:none}
.pkWrap{position:relative}
.pkNav{position:absolute;top:38%;z-index:5;width:44px;height:44px;border:0;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(15,34,51,.2);font-size:22px;color:var(--deep);display:grid;place-items:center;transition:transform .15s}
.pkNav:hover{transform:scale(1.08)}.pkNav.l{left:-18px}.pkNav.r{right:-18px}
.pkDots{display:flex;justify-content:center;gap:6px;margin-top:4px}.pkDots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .25s}.pkDots i.on{width:22px;border-radius:4px;background:var(--coral)}
@media (max-width:720px){.pkNav{display:none}}
.pick{scroll-snap-align:start;background:#fff;border-radius:var(--r);padding:10px;box-shadow:var(--sh);transition:transform .18s}
.pick:hover{transform:translateY(-4px)}
.pick .hl{margin:12px 6px 2px;font-weight:700;font-size:16px;line-height:1.4}
.pick .pr{margin:0 6px;font-family:"Do Hyeon";font-size:22px;color:var(--coral-d)}
.pick .mt{margin:2px 6px 6px;font-size:13px;color:var(--sub)}

/* 섬마을 바로가기 (12 읍면) */
.isles{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.isle{position:relative;overflow:hidden;background:#fff;border-radius:14px;padding:16px 16px 14px;border:1px solid var(--line);transition:border-color .15s,box-shadow .15s}
.isle:hover{border-color:transparent;box-shadow:var(--sh)}
.isle::after{content:"";position:absolute;inset:auto -30% -60% auto;width:110px;height:110px;border-radius:50%;background:var(--nacre);opacity:.55}
.isle b{position:relative;z-index:1;display:block;font-family:"Do Hyeon";font-size:20px}
.isle span{position:relative;z-index:1;display:block;font-size:12.5px;color:var(--sub)}
.isle em{position:relative;z-index:1;display:inline-block;margin-top:8px;font-style:normal;font-size:12px;font-weight:700;color:var(--coral-d);background:var(--coral-s);border-radius:6px;padding:1px 8px}

/* 소식 (직방 '최신 부동산 동향' 스타일) */
.news{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.nw{background:#F1ECE6;border-radius:14px;padding:20px;display:flex;flex-direction:column;min-height:150px}
.nw:nth-child(2){background:#E9F0EC}.nw:nth-child(3){background:#ECEAF4}
.nw b{font-size:16px;line-height:1.5}.nw small{margin-top:auto;color:var(--sub);font-size:12.5px}
.nw.all{background:#fff;border:1px solid var(--line);justify-content:space-between}
.nw.all b{font-weight:500;color:var(--sub)}.nw.all b strong{color:var(--ink)}
.nw.all i{align-self:flex-end;width:60px;height:12px;border-bottom:1.5px solid var(--ink);border-right:1.5px solid var(--ink);transform:skewX(45deg)}

/* 공지 */
.notice{margin-top:44px;border-top:2px solid var(--ink)}
.notice a{display:flex;justify-content:space-between;gap:12px;padding:15px 4px;border-bottom:1px solid var(--line);font-size:15px}
.notice a small{color:var(--mute);flex:none}

/* 채널 CTA */
.cta{margin:72px 0 0;position:relative;overflow:hidden;border-radius:26px;padding:44px 40px;color:#fff;
  background:radial-gradient(500px 240px at 88% 110%,rgba(255,90,54,.55),transparent 60%),linear-gradient(120deg,var(--deep) 0%,var(--deep2) 100%)}
.cta h3{margin:0 0 6px;font-family:"Do Hyeon";font-weight:400;font-size:32px}
.cta p{margin:0 0 22px;color:rgba(255,255,255,.78)}
.cta .btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700}
.btn.c{background:var(--coral);color:#fff}.btn.w{background:#fff;color:var(--deep)}.btn.g{background:#03C75A;color:#fff}.btn.y{background:#FF0033;color:#fff}
.btn.o{background:#fff;border:1px solid var(--line);color:var(--ink)}
.cta .shell{position:absolute;right:40px;top:30px;width:150px;opacity:.95}

/* 푸터 */
.ft{margin-top:80px;background:var(--deep);color:#AFC0CD;font-size:13.5px}
.ft .in{padding:40px 20px 34px;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:30px}
.ft b{color:#fff}.ft a:hover{color:#fff}.ft ul{list-style:none;margin:8px 0 0;padding:0;line-height:2}
.ft .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);padding-top:18px;line-height:1.9;font-size:12.5px}

/* ============ 매물 지도 (다방 스타일) ============ */
.mapPage{display:grid;grid-template-columns:76px 430px 1fr;height:calc(100vh - 69px)}
.rail{border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column;padding:10px 6px;gap:4px}
.rail button{border:0;background:none;border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--sub)}
.rail button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button.on{background:var(--coral-s);color:var(--coral-d);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--coral)}
.side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:#fff}
.fbar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.fb{position:relative}
.fb>button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:500}
.fb>button.on{border-color:var(--ink);font-weight:700}
.fb>button::after{content:"";width:6px;height:6px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg) translateY(-2px)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:14px}
.pop h5{margin:0 0 8px;font-size:13px;color:var(--sub);font-weight:500}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{cursor:pointer}.chk input{display:none}
.chk span{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.chk input:checked+span{border-color:var(--coral);background:var(--coral-s);color:var(--coral-d);font-weight:700}
.rng{display:flex;align-items:center;gap:6px}.rng input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ico{border:1px solid var(--line);background:#fff;border-radius:10px;width:36px;display:grid;place-items:center}
.lhead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.lhead .pill{background:var(--ink);color:#fff;border-radius:99px;padding:5px 14px;font-weight:700;font-size:14px}
.lhead select{border:0;background:none;font-size:13.5px;color:var(--sub)}
.list{overflow:auto;flex:1;padding:0 6px 20px}
.item{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:16px 10px;border-bottom:1px solid var(--line);border-radius:12px;cursor:pointer;transition:background .12s}
.item:hover,.item.hot{background:#FBF7F4}
.item .thumb{aspect-ratio:auto;height:118px}
.item .thumb svg.ill{width:90%}
.item h4{margin:2px 0 2px;font-family:"Do Hyeon";font-weight:400;font-size:22px;letter-spacing:-.01em}
.item .k{font-size:14px;font-weight:500}.item .s{font-size:13.5px;color:var(--sub)}
.item .d{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tags i{font-style:normal;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--kelp-s);color:var(--kelp)}
.tags i.w{background:#FFF1DC;color:#B36A00}.tags i.c{background:var(--coral-s);color:var(--coral-d)}
.empty{padding:50px 20px;text-align:center;color:var(--sub)}
.mapBox{position:relative;z-index:0;isolation:isolate;background:#DDE6EA;overflow:hidden;min-width:0}
#map{position:absolute!important;inset:0;width:100%!important;height:100%!important}
.mapMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);padding:20px}
.mk{transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:0;background:#fff;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;border:1.5px solid var(--coral)}
.mk b{display:grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:99px;background:var(--coral);color:#fff;font-size:14px}
.mk span{padding:0 12px 0 8px;color:var(--ink)}
.mk.sel{border-color:var(--deep)}.mk.sel b{background:var(--deep)}
.mk.pr{background:var(--coral);color:#fff;padding:6px 11px;border-color:#fff}
.mk.pr.hot{background:var(--deep);transform:translate(-50%,-100%) scale(1.12);z-index:999}
.leaflet-div-icon{background:none!important;border:0!important}
.mapTools{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapTools button{border:0;background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.toggleView{display:none}

/* ============ 상세 (모달) ============ */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(10,22,33,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px}
.sheet{width:min(980px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:0}}
.sheet .top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.x{border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;font-size:20px}
.tour{position:relative;aspect-ratio:16/9;background:linear-gradient(145deg,var(--c1),var(--c2))}
.tour iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tour .play{position:absolute;inset:0;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.tour .play i{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:"Do Hyeon";font-size:28px;background:rgba(255,255,255,.16);
  box-shadow:0 0 0 10px rgba(255,255,255,.1),0 0 60px rgba(255,255,255,.35);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,255,255,.05),0 0 80px rgba(255,255,255,.5)}}
.body{display:grid;grid-template-columns:1fr 320px;gap:28px;padding:26px}
.body h2{margin:0;font-family:"Do Hyeon";font-weight:400;font-size:34px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:18px 0;border-top:1px solid var(--line)}
.facts div{display:flex;padding:12px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.facts dt{width:92px;color:var(--sub);flex:none}.facts dd{margin:0;font-weight:500}
.desc{white-space:pre-line;background:var(--bg);border-radius:14px;padding:18px;line-height:1.8}
.aside{position:sticky;top:10px;align-self:start;border:1px solid var(--line);border-radius:18px;padding:20px}
.aside .btn{width:100%;justify-content:center;margin-top:8px}
.aside small{display:block;color:var(--sub);font-size:12.5px;line-height:1.7;margin-top:12px}

/* ============ 서브 페이지 ============ */
.pageHead{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--deep),var(--deep2));color:#fff;padding:54px 0 46px}
.pageHead h1{margin:0;font-family:"Do Hyeon";font-weight:400;font-size:40px}.pageHead p{margin:6px 0 0;color:rgba(255,255,255,.75)}
.pageHead::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--nacre);opacity:.22}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.card h3{margin:0 0 6px;font-family:"Do Hyeon";font-weight:400;font-size:24px}
.card p{margin:0;color:var(--sub)}
.step{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
.step div{background:#fff;border-radius:14px;padding:18px;border:1px solid var(--line)}
.step div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;font-weight:900;margin-bottom:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:200;background:var(--deep);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ============ 촘촘한 정보 / 모바일 앱 UI ============ */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:26px}
.stat{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid var(--line)}
.stat b{display:block;font-family:"Do Hyeon";font-size:30px;line-height:1.1}.stat span{font-size:13px;color:var(--sub)}
.stat.hot b{color:var(--coral)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mini{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s}.mini:hover{transform:translateY(-3px)}
.mini .thumb{border-radius:0;aspect-ratio:16/10}.mini .in{padding:12px 14px 14px}
.mini .pr{font-family:"Do Hyeon";font-size:20px;color:var(--ink)}.mini .mt{font-size:13px;color:var(--sub)}
.mini .ex{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips a{border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 16px;font-weight:500;font-size:14.5px}
.chips a:hover{border-color:var(--coral);color:var(--coral-d)}
.new{display:inline-block;font-size:11px;font-weight:900;color:#fff;background:var(--coral);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.alertBtn{border:1px solid var(--coral);color:var(--coral-d);background:var(--coral-s);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.tabs2{display:flex;gap:6px;margin-bottom:18px}.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:700}
.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stamp{position:absolute;inset:0;z-index:3;background:rgba(15,34,51,.55);display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px}
.chg{font-size:12px;font-weight:900;color:#1C7C54}.chg.up{color:var(--coral-d)}
.al{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px}
.al .t{flex:1}.al b{display:block}.al small{color:var(--sub)}
.al .n{font-family:"Do Hyeon";font-size:26px;color:var(--coral)}
.install{display:flex;align-items:center;gap:12px;background:var(--deep);color:#fff;border-radius:14px;padding:14px 16px;margin:18px 0}
.install b{flex:1}.install button{border:0;border-radius:10px;background:var(--coral);color:#fff;font-weight:700;padding:9px 14px}
.tabbar{display:none}
.viewToggle{display:none}
.mapNote{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;font-size:12.5px;color:var(--sub);box-shadow:0 3px 10px rgba(0,0,0,.12);max-width:70%}
.similar{margin-top:26px}.similar h3{font-family:"Do Hyeon";font-weight:400;font-size:22px;margin:0 0 12px}
.similar .grid4{grid-template-columns:repeat(3,1fr)}

/* ============ 반응형 ============ */
@media (max-width:1000px){
  .cats{grid-template-columns:repeat(3,1fr);margin:-70px 16px 0}.isles{grid-template-columns:repeat(3,1fr)}.news{grid-template-columns:repeat(2,1fr)}
  .mapPage{grid-template-columns:64px minmax(0,1fr);height:auto}.mapPage>*{min-width:0}.mapBox{grid-column:1/-1;height:62vh;order:-1}.side{min-height:60vh}
  .body{grid-template-columns:1fr}.aside{position:static}.grid3,.step{grid-template-columns:1fr 1fr}.ft .in{grid-template-columns:1fr}
}
@media (max-width:720px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:1500;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar a{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;color:var(--sub)}
  .tabbar a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a.on{color:var(--coral-d);font-weight:700}
  .tabbar .cnt{position:absolute;top:4px;left:55%;min-width:17px;height:17px;border-radius:9px;background:var(--coral);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
  .stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.grid4,.similar .grid4{grid-template-columns:1fr 1fr}
  .mini .pr{font-size:17px}.hero{min-height:470px}
  .viewToggle{display:flex;position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:1400;background:var(--deep);color:#fff;border:0;border-radius:99px;padding:11px 20px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.25);gap:6px}
  .mapPage .mapBox{display:none}.mapPage.showMap .mapBox{display:block;height:calc(100vh - 180px)}.mapPage.showMap .side{display:none}
  .fbar{flex-wrap:nowrap;overflow-x:auto}.fb{flex:none}.pop{position:fixed;left:10px;right:10px;top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));min-width:0}
  .modal{padding:0}.sheet{border-radius:0;min-height:100vh;animation:none}.aside .btn.c{flex:2}.tour{aspect-ratio:4/3}
  .body{padding:18px 16px 90px}.aside{position:fixed;left:0;right:0;top:auto;bottom:0;z-index:5;border-radius:18px 18px 0 0;border:0;box-shadow:0 -8px 24px rgba(0,0,0,.12);background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}
  .aside>b,.aside>small{display:none}.aside .btn{flex:1;margin-top:0;padding:13px 8px;font-size:14px}
  .nav,.hd .tel{display:none}.menuBtn{display:block}
  .nav.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:#fff;padding:10px;border-bottom:1px solid var(--line);box-shadow:var(--sh)}
  .nav.open a{color:var(--ink)!important}
  .hero .copy{padding:120px 16px 120px}.cats{grid-template-columns:repeat(2,1fr)}.isles{grid-template-columns:repeat(2,1fr)}.news,.grid3,.step{grid-template-columns:1fr}
  .mapPage{grid-template-columns:minmax(0,1fr)}.mapPage>*{min-width:0}.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .lhead{flex-wrap:wrap;gap:8px}.item{min-width:0}.item>div:last-child{min-width:0}
  .rail button{min-width:64px}.mapBox{height:52vh}.item{grid-template-columns:120px 1fr}.item .thumb{height:100px}
  .cta{padding:30px 22px}.ft{margin-bottom:0}.cta .shell{display:none}.facts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

let PKTIMER=null;
function pickSlider(){clearInterval(PKTIMER);const box=$("#picks");if(!box)return;const cards=[...box.querySelectorAll(".pick")];if(cards.length<2){$("#pkL")?.remove();$("#pkR")?.remove();return}
  const dots=$("#pkDots");if(box.scrollWidth<=box.clientWidth+4){$("#pkL").hidden=$("#pkR").hidden=true;dots.innerHTML="";return}   // 다 보이면 넘길 필요 없음
  dots.innerHTML=cards.map(()=>"<i></i>").join("");
  const step=()=>cards[0].getBoundingClientRect().width+18;
  const at=()=>Math.round(box.scrollLeft/step()),last=()=>box.scrollLeft+box.clientWidth>=box.scrollWidth-4;
  const mark=()=>{const i=last()?cards.length-1:at();[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i))};
  const go=d=>{if(d>0&&last())box.scrollTo({left:0});else if(d<0&&box.scrollLeft<=4)box.scrollTo({left:box.scrollWidth});else box.scrollBy({left:d*step()})};
  $("#pkL").onclick=()=>{go(-1);restart()};$("#pkR").onclick=()=>{go(1);restart()};
  dots.onclick=e=>{const i=[...dots.children].indexOf(e.target);if(i>=0){box.scrollTo({left:i*step()});restart()}};
  box.addEventListener("scroll",()=>requestAnimationFrame(mark),{passive:true});mark();
  let hold=false;const restart=()=>{clearInterval(PKTIMER);if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;PKTIMER=setInterval(()=>{if(!hold&&document.body.contains(box)&&!document.hidden)go(1)},3500)};
  ["mouseenter","touchstart","focusin"].forEach(ev=>box.parentNode.addEventListener(ev,()=>hold=true,{passive:true}));
  ["mouseleave","touchend","focusout"].forEach(ev=>box.parentNode.addEventListener(ev,()=>{hold=false;restart()},{passive:true}));
  restart()}

let VTIMER=null;
function heroVideos(){clearTimeout(VTIMER);const box=$("#vids"),hero=$("#hero");if(!box)return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||navigator.connection?.saveData)return;   // 데이터 절약·움직임 줄이기 설정이면 영상 생략
  let list=(CFG.HERO_VIDEOS||[]).slice();if(!list.length)return;
  const vs=[0,1].map(()=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");v.preload="auto";v.setAttribute("aria-hidden","true");box.appendChild(v);return v});
  let cur=0,idx=0;const dots=$("#vdots");
  const drawDots=()=>{dots.innerHTML=list.length>1?list.map((_,i)=>`<i class="${i===idx?"on":""}" style="--d:${CFG.HERO_SECONDS||12}s"></i>`).join(""):""};
  const play=i=>{if(!list.length){hero.classList.remove("hasVid");dots.innerHTML="";return}
    idx=(i+list.length)%list.length;const v=vs[cur],src=list[idx];
    v.onerror=()=>{list.splice(idx,1);play(idx)};                         // 없는 파일은 건너뜀
    v.oncanplay=()=>{v.oncanplay=null;v.play().catch(()=>{});vs.forEach(x=>x.classList.toggle("on",x===v));hero.classList.add("hasVid");
      const dur=isFinite(v.duration)&&v.duration>1?v.duration:(CFG.HERO_SECONDS||12);    // 영상 길이만큼 끝까지 재생
      drawDots();dots.querySelectorAll("i").forEach(d=>d.style.setProperty("--d",dur+"s"));
      if(list.length<2)return;let done=false;const next=()=>{if(done||!document.body.contains(v))return;done=true;clearTimeout(VTIMER);cur=1-cur;play(idx+1)};
      v.ontimeupdate=()=>{if(v.duration&&v.currentTime>=v.duration-1.6)next()};     // 끝나기 1.6초 전부터 다음 영상으로 부드럽게
      v.onended=next;clearTimeout(VTIMER);VTIMER=setTimeout(next,(dur+4)*1000)};     // 혹시 멈춰도 다음으로
    v.loop=list.length===1;v.src=src;v.load()};
  play(0);
  new IntersectionObserver(es=>es.forEach(e=>vs.forEach(v=>v.classList.contains("on")&&(e.isIntersecting?v.play().catch(()=>{}):v.pause())))).observe(hero)}

  const aa=wrap.querySelector("#areaAlert");if(aa)aa.onclick=addAA;wrap.addEventListener("click",e=>{if(e.target.closest("[data-aalert]"))addAA()});
  const bk=wrap.querySelector("#bkGo");if(bk)bk.onclick=()=>{const d=wrap.querySelector("#bkD").value,tel=(OFF.tel||"").replace(/[^0-9]/g,"");
    if(!d){toast("방문 희망 날짜를 골라 주세요");wrap.querySelector("#bkD").focus();return}
    const body=`[방문 예약] 매물 ${x.code} (${x.dong||""} ${x.type||""})\n날짜: ${d} ${wrap.querySelector("#bkT").value}\n인원: ${wrap.querySelector("#bkN").value}\n성함: ${wrap.querySelector("#bkName").value||"-"}`;
    if(tel){location.href=`sms:${tel}?body=${encodeURIComponent(body)}`;return}
    const done=()=>toast("예약 내용을 복사했습니다. 문의 페이지의 연락처로 보내주세요");
    (navigator.clipboard?navigator.clipboard.writeText(body):Promise.reject()).then(done).catch(()=>{try{prompt("아래 예약 내용을 복사해 보내주세요",body)}catch(e){}})};
  return ()=>{io.disconnect();so.disconnect()}}

/* ================= 서브 페이지 ================= */
const head=(t,p)=>`<section class="pageHead"><div class="wrap"><h1>${t}</h1><p>${p}</p></div></section>`;
function pickPage(){const P=ALL.filter(x=>x.feat).sort((a,b)=>(a.feat.rank||99)-(b.feat.rank||99));
  main.innerHTML=head("추천 매물","중개사가 직접 다녀와 자신 있게 권하는 매물")+`<div class="wrap sec" style="padding-top:36px"><div class="grid3">${(P.length?P:ALL.slice().sort(sortNew).slice(0,9)).map(x=>`<a class="pick" href="#/m/${encodeURIComponent(x.code)}">${thumb(x)}<div class="hl">${esc(x.feat?.headline||`${x.dong} ${x.type}`)}</div><div class="pr">${esc(title(x))}</div><div class="mt">${esc(x.dong||"")} · ${esc(area(x))}</div></a>`).join("")}</div></div>`}
function favPage(){const tab=LS.get("wando.favtab","fav"),snap=LS.get("wando.favsnap",{});
  const codes=tab==="fav"?FAV.get():RECENT.get();
  const card=c=>{const x=ALL.find(y=>String(y.code)===c),sn=snap[c];
    if(!x)return sn?`<div class="mini" style="position:relative;opacity:.85"><div class="thumb t-${esc(sn.type||"기타")}">${illOf(sn.type)}<div class="stamp">거래 완료 · 내려간 매물</div></div><div class="in"><div class="pr">${esc(sn.t)}</div><div class="mt">${esc(sn.dong||"")} ${esc(sn.type||"")} · ${esc(sn.a||"")}</div><div class="ex"><span>매물번호 ${esc(c)}</span><button class="alertBtn" data-fav="${esc(c)}">목록에서 빼기</button></div></div></div>`:"";
    let chg="";if(tab==="fav"&&sn){const d=(Number(x.price)||0)-(Number(sn.price)||0);if(d)chg=`<span class="chg ${d>0?"up":""}">${d>0?"▲":"▼"} ${won(Math.abs(d))} ${d>0?"올랐어요":"내렸어요"}</span>`}
    return miniCard(x).replace('<div class="ex">',`<div class="ex">${chg?chg+"</div><div class=\"ex\">":""}`)};
  main.innerHTML=head("찜 · 최근 본 매물","이 기기에 저장됩니다 — 찜한 매물의 가격 변동과 거래 완료를 알려드려요")+`<div class="wrap sec" style="padding-top:30px">
   <div class="tabs2"><button data-tab="fav" class="${tab==="fav"?"on":""}">♥ 찜한 매물 ${FAV.get().length}</button><button data-tab="recent" class="${tab==="recent"?"on":""}">최근 본 매물 ${RECENT.get().length}</button></div>
   ${codes.length?`<div class="grid4">${codes.map(card).join("")}</div>`:`<div class="empty">${tab==="fav"?"아직 찜한 매물이 없어요.<br>매물의 ♥를 눌러 모아보세요.":"아직 본 매물이 없어요."}<br><a class="btn c" style="margin-top:14px" href="#/map">매물 보러 가기</a></div>`}
   ${tab==="recent"&&codes.length?'<p style="text-align:right"><button class="btn o" id="clrRecent">최근 본 기록 지우기</button></p>':""}</div>`;
  main.onclick=e=>{const t=e.target.closest("[data-tab]");if(t){LS.set("wando.favtab",t.dataset.tab);favPage()}if(e.target.id==="clrRecent"){LS.set("wando.recent",[]);favPage()}}}
function lifePage(){main.innerHTML=head("완도 섬 생활","3읍 9면, 섬마다 다른 삶의 모습")+`<div class="wrap sec" style="padding-top:36px">
  <div class="grid3">${[["바다가 일터","전복·김·미역·다시마 양식이 활발해 귀어 일자리를 찾기 좋습니다. 전국 전복 생산의 상당 부분이 완도에서 나옵니다."],["다리로 이어진 섬","완도읍·신지·고금·약산 등은 다리로 육지와 연결되어 차로 오갈 수 있습니다."],["배로 닿는 섬","노화·보길·소안·청산·금일 등은 여객선으로 오갑니다. 배편 시간과 선착장 거리를 꼭 확인하세요."]].map(([t,p])=>`<div class="card"><h3>${t}</h3><p>${p}</p></div>`).join("")}</div>
  <h2 class="dh" style="text-align:left;font-size:30px;margin:48px 0 16px">읍면 소개</h2>
  <div class="isles">${Object.entries(EMD).map(([d,v])=>`<a class="isle" href="#/map?dong=${encodeURIComponent(d)}"><b>${d}</b><span>${v.t}</span><em>${v.s}</em></a>`).join("")}</div></div>`}
function guidePage(){main.innerHTML=head("매매 가이드","섬 부동산을 처음 알아보는 분들을 위한 안내")+`<div class="wrap sec" style="padding-top:36px">
  <h2 class="dh" style="text-align:left;font-size:28px;margin:0 0 16px">거래 순서</h2>
  <div class="step"><div><b>매물 둘러보기</b><p style="margin:4px 0 0;color:var(--sub)">360° VR과 영상으로 먼저 확인</p></div><div><b>현장 방문</b><p style="margin:4px 0 0;color:var(--sub)">배편·선착장·도로를 함께 확인</p></div><div><b>서류 확인</b><p style="margin:4px 0 0;color:var(--sub)">등기부·건축물대장·토지대장</p></div><div><b>계약·잔금</b><p style="margin:4px 0 0;color:var(--sub)">확인·설명서와 함께 안전하게</p></div></div>
  ${NEWS.map((n,i)=>`<div class="card" id="g${i}" style="margin-top:18px"><h3>${n[0]}</h3><p>${[
   "① 미등기·일부미등기 건물은 대출과 명의 이전에 제약이 있을 수 있습니다. ② 도로에 접하지 않은 땅은 건축이 어렵습니다. ③ 선착장까지 거리와 ④ 상수도·지하수 여부, ⑤ 배편 횟수를 꼭 확인하세요.",
   "귀어·귀농 교육 이수자는 정착 자금, 주택 구입·신축 지원 등을 받을 수 있습니다. 지원 조건과 금액은 해마다 바뀌니 완도군과 귀어귀농 지원센터에 확인하세요.",
   "양식장 가까운 집은 출퇴근이 편하지만, 작업 시간대의 소음·냄새와 태풍 때 바닷바람을 함께 고려하세요.",
   "연세는 1년치 임대료를 한 번에 내는 방식으로 섬 지역에서 흔합니다. 계약 기간 중 중도 해지 시 반환 조건을 계약서에 꼭 적어 두세요."][i]}</p></div>`).join("")}</div>`}
function contactPage(){const tel=(OFF.tel||"").replace(/[^0-9]/g,"");
  main.innerHTML=head("매물 의뢰·문의","팔거나 임대할 집·땅, 찾고 싶은 매물을 알려주세요")+`<div class="wrap sec" style="padding-top:36px"><div class="grid3">
  <div class="card"><h3>전화 상담</h3><p>${esc(OFF.tel||"사무소 전화번호 준비 중")}</p>${tel?`<a class="btn c" style="margin-top:14px" href="tel:${tel}">전화하기</a>`:""}</div>
  <div class="card"><h3>문자 문의</h3><p>원하는 지역·유형·예산을 적어 보내주세요.</p>${tel?`<a class="btn o" style="margin-top:14px" href="sms:${tel}?body=${encodeURIComponent("[완도 섬 부동산] 매물 문의: 지역 / 유형 / 예산")}">문자 보내기</a>`:""}</div>
  <div class="card"><h3>매물 내놓기</h3><p>주소(리·번지), 면적, 희망 가격, 연락처를 알려주시면 현장 확인 후 등록해 드립니다.</p>${tel?`<a class="btn o" style="margin-top:14px" href="sms:${tel}?body=${encodeURIComponent("[매물 의뢰] 주소: / 면적: / 희망가: / 연락처:")}">의뢰 문자 보내기</a>`:""}</div></div>
  <div class="card" style="margin-top:18px"><h3>사무소</h3><p>${esc(OFF.name)} · 대표 ${esc(OFF.rep||"-")} · 등록번호 ${esc(OFF.regno||"-")}<br>${esc(OFF.addr||"")}</p></div></div>`}

/* ================= 라우터 ================= */
let BASEHASH="";
function route(){const h=location.hash||"#/",[path0,qs]=h.slice(1).split("?"),path=path0.split("#")[0],m=path.match(/^\/m\/(.+)$/);
  const mo=$("#modal");if(mo){mo._close();if(!m&&h===BASEHASH&&main.innerHTML)return}   // 상세 닫기 → 보던 자리 그대로
  if(m){if(!main.innerHTML)home();detail(decodeURIComponent(m[1]));return}
  const r=path.replace(/^\//,"")||"home";const dark=r==="home";$("#hd").classList.toggle("dark",dark);$("#nav").classList.remove("open");
  $$("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===r));
  BASEHASH=h;main.onclick=null;({home,map:()=>mapPage(qs),pick:pickPage,life:lifePage,guide:guidePage,fav:favPage,alert:alertPage,contact:contactPage,franchise:franchisePage}[r]||home)();
  $$("#tabbar a").forEach(a=>a.classList.toggle("on",a.dataset.t===r));if(r==="home"&&DEFERRED)$("#installBar").hidden=false;
  $("#ft").hidden=r==="map";window.scrollTo(0,0);
  if(h.includes("#g")){const g=h.split("#")[2];setTimeout(()=>document.getElementById(g)?.scrollIntoView(),50)}}
$("#menuBtn").onclick=()=>$("#nav").classList.toggle("open");
window.addEventListener("hashchange",route);
/* 파일로 직접 열었을 때: run.py가 켜져 있으면 http://127.0.0.1:8765/site/ 로 자동 이동 (네이버 지도는 등록된 주소에서만 열림) */
if(location.protocol==="file:"){fetch("http://127.0.0.1:8765/public/live.json",{cache:"no-store"}).then(r=>{if(r.ok)location.replace("http://127.0.0.1:8765/site/"+location.hash)})
  .catch(()=>{const b=document.createElement("div");b.style.cssText="position:fixed;left:0;right:0;top:0;z-index:4000;background:#E2431F;color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:700";
    b.textContent="파일로 직접 열면 네이버 지도가 열리지 않습니다. 실행.bat 을 켠 뒤 http://127.0.0.1:8765/site/ 로 열어주세요.";document.body.appendChild(b)})}
let DEFERRED=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED=e;const b=$("#installBar");if(b)b.hidden=false});
document.addEventListener("click",async e=>{if(e.target.id==="installBtn"&&DEFERRED){DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;$("#installBar").hidden=true}});
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});
(async()=>{applyData(await loadData());route();alertBadge();notifyNew();setTimeout(()=>{if(!location.hash.includes("franchise"))franchisePop()},1200);
  if(SRC==="예시"){const b=document.createElement("div");b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:3000;background:#B36A00;color:#fff;text-align:center;padding:8px;font-size:13.5px";
    b.textContent="실제 매물을 불러오지 못해 예시 매물을 보여주고 있습니다. run.py를 켜거나 인터넷 연결을 확인해 주세요.";document.body.appendChild(b)}})();
